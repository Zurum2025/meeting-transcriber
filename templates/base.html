<!DOCTYPE html>
<html lang = "en">
<head>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  
  <title>Meeting App</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>

</head>
<body>
  <nav class="navbar navbar-expand-lg py-3 px-4">
    <div class="container-fluid justify-content-between">
      <span class="navbar-brand fs-5 fw-semibold">AI Transcriber</span>
      <div class="d-flex align-items-center gap-3">
    {% if current_user.is_authenticated %}
  <span class="fw-light">Welcome, {{ current_user.firstname }}!</span>
  <a href="{{ url_for('logout') }}" class="btn btn-sm btn-light">Logout</a>
{% else %}
  <a href="{{ url_for('login') }}" class="btn btn-sm btn-light">Login</a>
{% endif %}
      </div>
    </div>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
