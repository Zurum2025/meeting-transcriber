<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>{% block title %}AI Transcriber{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>

</head>
<body>
  <nav class="navbar">
    <div class="container-fluid justify-content-between">
      <a class="brand" href="{{ url_for('home') }}">
        <span class="brand-mark"><span></span><span></span><span></span><span></span><span></span></span>
        AI Transcriber
      </a>
      <div class="d-flex align-items-center gap-3">
    {% if current_user.is_authenticated %}
  <span class="fw-light">Welcome, {{ current_user.Name.split(' ')[0] if current_user.Name else 'there' }}!</span>
  <a href="{{ url_for('logout') }}" class="btn btn-sm btn-light">Logout</a>
{% else %}
  <a href="{{ url_for('login') }}" class="btn btn-sm btn-primary">Login</a>
{% endif %}
      </div>
    </div>
  </nav>
  {% block content %}{% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
